<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variation Management</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {font-family:"Poppins",sans-serif;margin:0;background:#f0f0f0;}
    .container {padding:2rem;}
    .box {background:#fff;padding:2rem;border-radius:12px;box-shadow:0 6px 15px rgba(0,0,0,0.15);max-width:900px;margin:1rem auto;}
    .box h2 {margin-top:0;text-align:center;color:#667eea;}
    table {width:100%;border-collapse:collapse;margin-top:1rem;}
    th,td {padding:12px;text-align:center;border-bottom:1px solid #eee;}
    th {background:#667eea;color:white;}
    .btn {padding:6px 12px;border:none;border-radius:6px;cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);color:white;font-weight:600;}
    .btn.small {font-size:0.8rem;}
    .btn.danger {background:linear-gradient(135deg,#e63946,#d90429);}
    .btn:hover {transform:scale(1.03);}
    .form-row {margin:1rem 0;display:flex;gap:1rem;}
    .form-row input, .form-row textarea {flex:1;padding:10px;border:1px solid #ccc;border-radius:6px;}
  </style>
</head>
<body>
  <!-- Shared Header -->
  <div id="header"></div>

  <div class="container">
    <div class="box">
      <h2>⚙️ Variation Management</h2>

      <!-- Add Variation Form -->
      <div class="form-row">
        <input type="text" id="variationName" placeholder="Variation Name">
        <textarea id="variationInstruction" placeholder="Enter winning instructions..."></textarea>
        <button class="btn" onclick="addVariation()">➕ Add</button>
      </div>

      <!-- Table -->
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Instruction</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="variationTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal for Editing -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('editModal')">&times;</span>
      <h3>✏️ Edit Variation</h3>
      <div class="form-row" style="flex-direction:column;">
        <input type="text" id="editName" placeholder="Variation Name">
        <textarea id="editInstruction" placeholder="Enter instructions..."></textarea>
        <button class="btn" onclick="saveEdit()">💾 Save</button>
      </div>
    </div>
  </div>

  <script>
    let variations = [
      {id:1,name:"Top Line",instruction:"Mark all numbers in the first row"},
      {id:2,name:"Full House",instruction:"Mark all numbers in the ticket"},
    ];
    let editIndex = -1;

    function renderVariations(){
      const tbody=document.getElementById("variationTableBody");
      tbody.innerHTML="";
      variations.forEach((v,i)=>{
        const tr=document.createElement("tr");
        tr.innerHTML=`
          <td>${v.name}</td>
          <td>${v.instruction}</td>
          <td>
            <button class="btn small" onclick="openEdit(${i})">✏ Edit</button>
            <button class="btn small danger" onclick="deleteVariation(${i})">🗑 Delete</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    function addVariation(){
      const name=document.getElementById("variationName").value.trim();
      const instr=document.getElementById("variationInstruction").value.trim();
      if(!name||!instr){alert("Please enter both name and instruction.");return;}
      variations.push({id:Date.now(),name,instruction:instr});
      document.getElementById("variationName").value="";
      document.getElementById("variationInstruction").value="";
      renderVariations();
    }

    function deleteVariation(i){
      if(confirm("Delete this variation?")){
        variations.splice(i,1);
        renderVariations();
      }
    }

    function openEdit(i){
      editIndex=i;
      document.getElementById("editName").value=variations[i].name;
      document.getElementById("editInstruction").value=variations[i].instruction;
      document.getElementById("editModal").style.display="block";
    }

    function saveEdit(){
      const name=document.getElementById("editName").value.trim();
      const instr=document.getElementById("editInstruction").value.trim();
      if(!name||!instr){alert("Please fill both fields.");return;}
      variations[editIndex].name=name;
      variations[editIndex].instruction=instr;
      closeModal("editModal");
      renderVariations();
    }

    function closeModal(id){document.getElementById(id).style.display="none";}

    // Init
    renderVariations();
  </script>
  <script src="header.js"></script>
  <script>
    fetch("header.html").then(res=>res.text()).then(data=>{document.getElementById("header").innerHTML=data;updateMiniBalance();});
  </script>
</body>
</html>
