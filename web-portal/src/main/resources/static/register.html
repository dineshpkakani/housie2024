<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <script src="js/jquery.min.js"></script>
    <script src = "js/angular.min.js"> </script>
    <script src = "js/bootstrap.min.js"> </script>
    <script src="js/loginController.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            background: #fff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 350px;
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .error {
            color: red;
            font-size: 12px;
            margin-top: 4px;
        }
        .btn {
            width: 49%;
            background: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<div class="form-container" ng-controller="loginController" ng-app="loginApp">
    <h2>User Registration</h2>
    <form id="registrationForm" novalidate>

        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" required value="ganesh">
            <div class="error" id="firstNameError"></div>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" required  value="shankar">
            <div class="error" id="lastNameError" ></div>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" required minlength="5"  value="ganesh">
            <div class="error" id="usernameError"></div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required minlength="6"  value="ganesh">
            <div class="error" id="passwordError"></div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required  value="ganesh@shankar.com" ng-blur="checkEmail()">
            <div class="error" id="emailError"></div>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="phone" required pattern="\d{10}"  value="9429197485">
            <div class="error" id="phoneError"></div>
        </div>
<div class="form-group">
        <button type="button" style="float: left" ng-click="savePlayer()"  class="btn">Register</button> &nbsp;
        <button type="button" style="float: left" class="btn" ng-click="movetoLogin()" >Login</button>
</div>
        <div class="form-group">
            <div id="responseMessage" class="message"></div>
        </div>
    </form>
</div>

</body>
</html>
