server:
  port: 8085
  host: localhost

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0

spring:
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/housie
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        diaclet: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true
  devtools:
    restart:
      enabled: true
logging:
  file:
    name: d:/logs/application-debug.log
  level:
    root: "warn"
    org.springframework.web: "debug"
    org.hibernate: "error"