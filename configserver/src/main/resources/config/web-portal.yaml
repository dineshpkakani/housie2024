server:
  port: 8083

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
logging:
  file:
    name: d:/logs/application-debug.log
  level:
    root: "warn"
    org.springframework.web: "debug"
    org.hibernate: "error"