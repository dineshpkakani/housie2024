server:
  port: 8080
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
      register-with-eureka: true
      fetch-registry: true
spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:9296"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: web-portal
          uri: lb://web-portal
          predicates:
            - Path=/web-portal/**
          filters:
            - StripPrefix=1
        - id: securityservice
          uri: lb://securityservice
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
logging:
  file:
    name: d:/logs/application-debug1.log
  level:
    org:
      springframework: DEBUG
      hibernate:
        sql: DEBUG
app:
  jwt:
    secret: "dGhpc2lzLWFjdHVhbGx5LTI1Ni1iaXQtYmFzZTY0LWtleQ=="